name: Mate X5 Foldable E2E (FamilyTV Mobile)

on:
  workflow_dispatch:

jobs:
  matex5:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: python3 -m pip install -q pillow

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Mate X5 (2224x2496 @426dpi unfolded, 1080x2504 @426dpi folded) E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -o pipefail
            curl -fsSL --retry 3 -o FamilyTV-Mobile-test.apk https://paseo.uniai.ccwu.cc/tvbox/FamilyTV-Mobile-test.apk
            adb install -r -g FamilyTV-Mobile-test.apk
            python3 scripts/matex5_verify.py

      - name: Upload screenshots and dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matex5-results
          path: matex5_results/
          retention-days: 7
